name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import verified release source
        if: hashFiles('project-source.tar.gz') != ''
        run: |
          echo '7aaf9bf9494f3389aee6d1ccd075a6cd9f20147f03eeec429eb5a120249d06aa  project-source.tar.gz' | sha256sum -c -
          tar xzf project-source.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE VERSION RELEASE_NOTES.md .gitignore install.sh files assets scripts tests
          git rm project-source.tar.gz
          git commit -m 'Add server management and automatic dependency installation'
          git push origin HEAD:main
      - name: Validate source
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build IPK and APK without core
        run: docker run --rm -v "$PWD:/src" -w /src alpine:3.24 sh -c 'apk add --no-cache python3 apk-tools && python3 scripts/build.py --apk-tool /sbin/apk'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '\r\n' < VERSION)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "sing-box for openwrt $tag" --notes-file RELEASE_NOTES.md
          gh release upload "$tag" dist/luci-app-sb-router.apk dist/luci-app-sb-router.ipk dist/install.sh dist/SHA256SUMS --clobber
